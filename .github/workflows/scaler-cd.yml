name: Scaler CD

on:
  workflow_run:
    workflows: [ Scaler CI ]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      ciRunId:
        description: 'The ID of the Scaler CI run whose artifacts are published.'
        required: true
        type: string
      force:
        description: 'Push the image even if its tag already exists in the registry.'
        default: false
        required: false
        type: boolean

jobs:
  resolve:
    name: Resolve CI Run
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      chartPrerelease: ${{ steps.chart.outputs.chartPrerelease }}
      chartVersion: ${{ steps.chart.outputs.chartVersion }}
      imagePrerelease: ${{ steps.chart.outputs.imagePrerelease }}
      imageTag: ${{ steps.chart.outputs.imageTag }}
      runId: ${{ steps.run.outputs.runId }}
      sha: ${{ steps.run.outputs.sha }}
    permissions:
      actions: read

    steps:
      - name: Find CI Run
        id: run
        uses: actions/github-script@v9.0.0
        env:
          RUN_ID: ${{ github.event.workflow_run.id || inputs.ciRunId }}
        with:
          script: |
            const runId = process.env.RUN_ID;
            if (!/^\d+$/.test(runId)) {
              throw new Error('The CI run ID must be numeric.');
            }

            // Only publish artifacts that were successfully built from this repository's main branch
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(runId) });

            const workflow = '.github/workflows/scaler-ci.yml';
            if (run.path !== workflow) {
              throw new Error(`Run ${runId} is from workflow '${run.path}' instead of '${workflow}'.`);
            }

            if (run.head_branch !== 'main') {
              throw new Error(`Run ${runId} is from branch '${run.head_branch}' instead of 'main'.`);
            }

            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (run.head_repository?.full_name !== repository) {
              throw new Error(`Run ${runId} is from repository '${run.head_repository?.full_name}' instead of '${repository}'.`);
            }

            if (run.conclusion !== 'success') {
              throw new Error(`Run ${runId} concluded with '${run.conclusion}' instead of 'success'.`);
            }

            core.setOutput('runId', runId);
            core.setOutput('sha', run.head_sha);

      - name: Download Chart
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: chart
          path: ${{ runner.temp }}/chart
          run-id: ${{ steps.run.outputs.runId }}

      # The image tag is the chart's appVersion, and either is a prerelease if its version has a suffix
      - name: Read Chart Versions
        id: chart
        run: |
          chart=$(helm show chart "$RUNNER_TEMP"/chart/durabletask-azurestorage-scaler-*.tgz)
          chartVersion=$(yq -e '.version' <<< "$chart")
          imageTag=$(yq -e '.appVersion' <<< "$chart")

          {
            echo "chartVersion=$chartVersion"
            echo "chartPrerelease=$([[ "$chartVersion" == *-* ]] && echo true || echo false)"
            echo "imageTag=$imageTag"
            echo "imagePrerelease=$([[ "$imageTag" == *-* ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  publishImage:
    name: Publish Image
    runs-on: ubuntu-latest
    needs: resolve
    permissions:
      actions: read
      contents: write
      packages: write

    steps:
      - name: Download Image
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: image
          path: ${{ runner.temp }}/image
          run-id: ${{ needs.resolve.outputs.runId }}

      - name: Push Docker Image
        id: push
        uses: $/.github/actions/docker-push
        with:
          force: ${{ inputs.force == true }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          imageArchive: ${{ runner.temp }}/image/durabletask-azurestorage-scaler-${{ needs.resolve.outputs.imageTag }}.tar
          imageRepository: ghcr.io/${{ github.repository }}
          imageTag: ${{ needs.resolve.outputs.imageTag }}
          pushLatest: ${{ needs.resolve.outputs.imagePrerelease != 'true' }}

      - name: Create Image Release
        uses: $/.github/actions/github-release
        if: ${{ steps.push.outputs.success == 'true' }}
        with:
          asset: ${{ runner.temp }}/image/durabletask-azurestorage-scaler-${{ needs.resolve.outputs.imageTag }}.tar
          commitSha: ${{ needs.resolve.outputs.sha }}
          name: 'Durable Task KEDA External Scaler Image'
          prerelease: ${{ needs.resolve.outputs.imagePrerelease }}
          tag: 'Image_${{ needs.resolve.outputs.imageTag }}.${{ steps.push.outputs.shortDigest }}'
          version: '${{ needs.resolve.outputs.imageTag }}.${{ steps.push.outputs.shortDigest }}'

  publishChart:
    name: Publish Chart
    runs-on: ubuntu-latest
    needs: [ resolve, publishImage ]
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download Chart
        uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: chart
          path: ${{ runner.temp }}/chart
          run-id: ${{ needs.resolve.outputs.runId }}

      - name: Sync Chart
        id: sync
        uses: $/.github/actions/chart-sync
        with:
          assetPath: ${{ runner.temp }}/chart
          chartRepositoryDirectoryName: 'releases'
          chartRepositoryToken: ${{ secrets.CHART_REPO_PAT }}
          chartVersion: ${{ needs.resolve.outputs.chartVersion }}
          logoPath: ${{ github.workspace }}/img/storm-icon.png
          readmePath: ${{ github.workspace }}/charts/durabletask-azurestorage-scaler/README.md

      - name: Create Chart Release
        uses: $/.github/actions/github-release
        if: ${{ steps.sync.outputs.success == 'true' }}
        with:
          asset: ${{ runner.temp }}/chart
          commitSha: ${{ needs.resolve.outputs.sha }}
          name: 'Durable Task KEDA External Scaler Chart'
          prerelease: ${{ needs.resolve.outputs.chartPrerelease }}
          tag: 'Chart_${{ needs.resolve.outputs.chartVersion }}'
          version: ${{ needs.resolve.outputs.chartVersion }}
